name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: callreport
          POSTGRES_USER: calluser
          POSTGRES_PASSWORD: callpass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U calluser -d callreport"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/callreport
      SPRING_DATASOURCE_USERNAME: calluser
      SPRING_DATASOURCE_PASSWORD: callpass
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
