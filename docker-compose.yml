version: '3.8'
services:
  app:
    build: ./app
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/callreport
      - SPRING_DATASOURCE_USERNAME=calluser
      - SPRING_DATASOURCE_PASSWORD=callpass
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: callreport
      POSTGRES_USER: calluser
      POSTGRES_PASSWORD: callpass
    ports:
      - "5432:5432"
    volumes:
    
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:


